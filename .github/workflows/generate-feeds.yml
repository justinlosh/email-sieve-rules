# This GitHub Action workflow generates JSON feeds in the feed folder on every commit to production.
# It creates feed.json (all data from domains and lists), domains.json (all domains data), and lists.json (all lists data).

name: Generate JSON Feeds

on:
  push:
    branches:
      - production

jobs:
  generate-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Generate JSON feeds
        run: |
          python .github/scripts/generate_feeds.py

      - name: Commit and push feeds
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feed/feed.json feed/domains.json feed/lists.json
          git commit -m 'chore: update JSON feeds [skip ci]' || echo 'No changes to commit'
          git push
